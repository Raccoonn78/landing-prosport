name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Укажите master, если ваша ветка называется master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Берем Node.js версии 24, как в вашем Dockerfile (node:24-alpine)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Этап deps из Dockerfile
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Этап build из Dockerfile
      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Забираем результат сборки из папки dist (этап dist из Dockerfile)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
